name: Speed

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: speed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Check the speed of uhttp
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout the change with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout main with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .speed/main
          persist-credentials: false

      - name: Setup pnpm with pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js 24 with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .speed/main/pnpm-lock.yaml

      - name: Install and compile the change
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir packages/ts run compile

      - name: Check that main has a uhttp package to compare
        id: main
        run: |
          mkdir -p speed-report
          if [ -f .speed/main/packages/ts/package.json ] && grep -q '"compile"' .speed/main/packages/ts/package.json; then
            echo "comparable=true" >> "$GITHUB_OUTPUT"
          else
            echo "comparable=false" >> "$GITHUB_OUTPUT"
            printf '## Speed check\n\nMain has no uhttp package for this job to compile, so the job measured nothing.\n' | tee speed-report/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install and compile main
        if: steps.main.outputs.comparable == 'true'
        working-directory: .speed/main
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir packages/ts run compile

      - name: Measure uhttp before and after this PR, and uWebSockets.js on its own
        id: compare
        if: steps.main.outputs.comparable == 'true'
        continue-on-error: true
        env:
          BASE_ENTRY: .speed/main/packages/ts/dist/index.js
          CHANGE_ENTRY: packages/ts/dist/index.js
        shell: bash
        run: node packages/ts/benchmarks/speed-guard/compare.ts | tee speed-report/report.md

      - name: Report a speed script that ended before it wrote the tables, and fail the job
        if: steps.compare.outcome == 'failure'
        run: |
          printf '## Speed check\n\nThe speed script exited before it wrote the tables, so open the log of the measuring step to find the error.\n' | tee speed-report/report.md >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Record the pull request that the comment workflow posts the table on
        if: always() && hashFiles('speed-report/report.md') != ''
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s\n' "$PULL_REQUEST_NUMBER" > speed-report/pull-request-number

      - name: Upload the speed report with actions/upload-artifact v7.0.1
        if: always() && hashFiles('speed-report/report.md') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: speed-report
          path: speed-report/
          if-no-files-found: error
          retention-days: 7

      - name: Fail when uhttp after this PR is too much slower than uWebSockets.js on its own
        if: steps.compare.outputs.beyond_bare_limit == 'true'
        run: |
          echo "::error title=Speed limit::uhttp after this PR is beyond the speed limit against uWebSockets.js on its own, so read the speed tables in the job summary."
          exit 1
