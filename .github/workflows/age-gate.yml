name: Dependency Age Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-age:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - name: Run the age gate from the base commit's copy of the script
        run: |
          script_path="$RUNNER_TEMP/check-age.mjs"

          if ! git show "${BASE_SHA}:.github/scripts/check-age.mjs" > "$script_path" 2>/dev/null; then
            cp .github/scripts/check-age.mjs "$script_path"
          fi

          node "$script_path"
        env:
          MIN_AGE_DAYS: 4
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
