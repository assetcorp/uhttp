name: Supply Chain Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - name: Run the supply-chain gate
        run: node .github/scripts/check-supply-chain.mjs
