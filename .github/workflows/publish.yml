name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'The release version: patch, minor, major, or an exact version such as 1.2.3'
        required: true
        type: string
      dry-run:
        description: 'Run every step without a commit, a tag, a GitHub release, or a publish to npm'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to publish a prerelease for this push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Checkout with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js 24 with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve the prerelease version
        id: resolve
        run: node .github/scripts/resolve-prerelease.mjs

  lint:
    name: Lint
    needs: plan
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.plan.outputs.publish == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pnpm with pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js 24 with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint rules
        run: pnpm check

      - name: Lint
        run: pnpm nx run uhttp:lint

  typecheck:
    name: Typecheck
    needs: plan
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.plan.outputs.publish == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pnpm with pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js 24 with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm nx run uhttp:typecheck

  build:
    name: Build
    needs: plan
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.plan.outputs.publish == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pnpm with pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js 24 with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm nx run uhttp:build

  test:
    name: Test
    needs: plan
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.plan.outputs.publish == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pnpm with pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js 24 with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mount a FAT folder, which ignores the case of file names, for the static-file tests
        run: |
          sudo apt-get install -y -qq dosfstools
          truncate -s 64M "$RUNNER_TEMP/case-insensitive.img"
          mkfs.vfat "$RUNNER_TEMP/case-insensitive.img"
          sudo mkdir -p /mnt/case-insensitive
          sudo mount -o "loop,uid=$(id -u),gid=$(id -g)" "$RUNNER_TEMP/case-insensitive.img" /mnt/case-insensitive
          echo "UHTTP_CASE_INSENSITIVE_FOLDER=/mnt/case-insensitive" >> "$GITHUB_ENV"

      - name: Test
        run: pnpm nx run uhttp:test

  prerelease:
    name: Publish a prerelease under the next dist-tag
    needs: [plan, lint, typecheck, build, test]
    if: github.event_name == 'push' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pnpm with pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js 24 with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm nx run uhttp:build

      - name: Set the prerelease version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: pnpm nx release version "$VERSION" --projects=uhttp --git-commit=false --git-tag=false --stage-changes=false

      - name: Publish with provenance through the trusted publisher
        working-directory: packages/ts
        env:
          NPM_CONFIG_PROVENANCE: true
        run: npm publish --tag next --access public

  release:
    name: Release and publish to npm
    needs: [lint, typecheck, build, test]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.lint.result == 'success' && needs.typecheck.result == 'success' && needs.build.result == 'success' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-to-npm
      cancel-in-progress: false

    steps:
      - name: Checkout with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Check that main still points at the checked-out commit
        run: |
          git fetch origin main
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          MAIN_TIP_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "$CHECKED_OUT_SHA" != "$MAIN_TIP_SHA" ]; then
            echo "::error::The workflow checked out $CHECKED_OUT_SHA while main points at $MAIN_TIP_SHA, so GitHub would reject the release commit. Dispatch the workflow again, because a re-run checks out the commit of the first dispatch."
            exit 1
          fi

      - name: Check the version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -qE '^(patch|minor|major|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$'; then
            echo "::error::Set the version to patch, minor, major, or an exact version such as 1.2.3, in place of '$VERSION'."
            exit 1
          fi

      - name: Setup pnpm with pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js 24 with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm nx run uhttp:build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit, tag, push, and create the GitHub release
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -- --projects=uhttp --skip-publish
          if [ "$DRY_RUN" = "true" ]; then
            set -- "$@" --dry-run
          fi
          pnpm nx release "$VERSION" "$@"

      - name: Publish with provenance through the trusted publisher
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -- --projects=uhttp
          if [ "$DRY_RUN" = "true" ]; then
            set -- "$@" --dry-run
          fi
          pnpm nx release publish "$@"
