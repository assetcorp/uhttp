name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm with pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js ${{ matrix.node-version }} with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint rules
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Mount a FAT folder, which ignores the case of file names, for the static-file tests
        run: |
          sudo apt-get install -y -qq dosfstools
          truncate -s 64M "$RUNNER_TEMP/case-insensitive.img"
          mkfs.vfat "$RUNNER_TEMP/case-insensitive.img"
          sudo mkdir -p /mnt/case-insensitive
          sudo mount -o "loop,uid=$(id -u),gid=$(id -g)" "$RUNNER_TEMP/case-insensitive.img" /mnt/case-insensitive
          echo "UHTTP_CASE_INSENSITIVE_FOLDER=/mnt/case-insensitive" >> "$GITHUB_ENV"

      - name: Test with the coverage thresholds
        run: pnpm test:coverage
